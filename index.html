<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <!--
      Content Security Policy as a meta tag, because GitHub Pages serves static
      files and cannot set response headers. This is the main thing standing
      between an injected script and the session tokens in localStorage.

      default-src 'none' means every fetch type has to be named below, so a new
      kind of request fails loudly rather than silently being allowed. Nothing
      needs 'unsafe-inline': there is no inline script, and the few places that
      set a width or a backdrop do it through the CSSOM in dom.ts, which
      style-src does not police. Note the failure mode if that ever changes —
      a blocked style attribute is dropped in silence, and the element renders
      as though the declaration had never been written, which is how every bar
      on the stats screen came to be full width. The localhost entry in
      connect-src is what lets a locally served copy talk to a local API.

      frame-ancestors is deliberately absent: it is ignored in a meta tag, so
      framing has to be refused by a header the host does not let us set.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none';
               script-src 'self';
               style-src 'self';
               img-src 'self' https://image.tmdb.org data:;
               connect-src 'self' https://movietracker-api-production.up.railway.app http://localhost:* http://127.0.0.1:*;
               manifest-src 'self';
               worker-src 'self';
               base-uri 'none';
               form-action 'none'"
    />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <title>MovieTracker</title>
    <meta name="description" content="Watchlist, viewing diary, ratings, stats and shared lists for films and television." />
    <meta name="theme-color" content="#0d0f16" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MovieTracker" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon-192.png" sizes="192x192" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app" class="app">
      <div class="boot">
        <span class="brand-mark" aria-hidden="true">🎞️</span>
        <p>Loading MovieTracker…</p>
      </div>
    </div>
    <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>
    <noscript>MovieTracker needs JavaScript: the whole app is one page talking to an API.</noscript>
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
